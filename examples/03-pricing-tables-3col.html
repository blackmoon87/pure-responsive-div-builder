<!DOCTYPE html>
<html lang="en">
<head>

  <title>Pure Responsive DIV Structure</title>
  <style>
/* Reset & Global */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  min-height: 100vh;
  background-color: #0a0d12;
  color: #f0f6fc;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
  /* Content safety: whatever goes inside these divs must not burst them. */
  overflow-wrap: break-word;
}

/* No div may exceed its container, whatever is placed inside it. An
   element selector loses to every class rule below, so an authored
   max-width still wins where one is set on purpose. */
div { max-width: 100%; }

/* Media never exceeds its container, whatever its intrinsic size. */
img, video, canvas, iframe, svg, table { max-width: 100%; }
img, video { height: auto; }

/* Desktop Base Styles */
.pricing-section {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: center;
  gap: 40px;
  margin-left: auto;
  margin-right: auto;
  min-height: 60px;
  max-width: 1200px;
  padding: 60px 24px 60px 24px;
  min-width: 0;
  flex-grow: 1;
}

.pricing-header {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: center;
  gap: 12px;
  min-height: 60px;
  max-width: 600px;
  padding: 16px;
  min-width: 0;
  flex-grow: 1;
}

.pricing-title {
  display: block;
  width: 240px;
  min-height: 36px;
  padding: 16px;
  background-color: #38bdf8;
  border-radius: 6px;
  min-width: 0;
  flex-grow: 1;
}

.pricing-subtitle {
  display: block;
  width: 360px;
  min-height: 20px;
  padding: 16px;
  background-color: #1d2737;
  border-radius: 4px;
  min-width: 0;
  flex-grow: 1;
}

.pricing-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  row-gap: 16px;
  align-items: center;
  width: 100%;
  min-height: 60px;
  padding: 16px;
  min-width: 0;
  flex-grow: 1;
}

.plan-card {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 24px;
  min-height: 420px;
  padding: 32px;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 16px;
  min-width: 0;
}

.plan-name {
  display: block;
  width: 100px;
  min-height: 24px;
  padding: 16px;
  background-color: #5a6b85;
  border-radius: 4px;
  min-width: 0;
  flex-grow: 1;
}

.plan-price {

  padding: 16px;
  background-color: #f0f6fc;
  border-radius: 6px;
  min-width: 0;
  flex-grow: 1;
}

.plan-features {

/* Tablet (max-width: 992px) */
@media (max-width: 992px) {
  .pricing-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .plan-card-featured {
    grid-column: span 2;
    order: -1;
  }
}

/* Mobile (max-width: 576px) */
@media (max-width: 576px) {
  .pricing-section {
    gap: 24px;
    padding: 32px 16px 32px 16px;
  }

  .pricing-title {
    max-width: 100%;
  }

  .pricing-subtitle {

    max-width: 280px;
