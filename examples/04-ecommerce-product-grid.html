<!DOCTYPE html>
<html lang="en">

  <title>Pure Responsive DIV Structure</title>
  <style>
/* Reset & Global */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  min-height: 100vh;
  background-color: #0a0d12;
  color: #f0f6fc;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* Desktop Base Styles */
.catalog-wrapper {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 32px;
  margin-left: auto;
  margin-right: auto;
  justify-self: center;
  min-height: 60px;
  max-width: 1280px;
  padding: 40px 24px 40px 24px;
  flex-grow: 1;
}

.catalog-toolbar {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  min-height: 60px;
  padding: 16px 20px 16px 20px;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 10px;
  flex-grow: 1;
}

.toolbar-search {
  display: block;
  width: 260px;
  min-height: 36px;
  padding: 16px;
  background-color: #18202d;
  border-radius: 6px;
}

.toolbar-filters {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 12px;
  min-height: 60px;
  padding: 16px;
  flex-grow: 1;
}

.filter-chip {
  display: block;
  width: 80px;
  min-height: 32px;
  padding: 16px;
  background-color: #1d2737;
  border-radius: 20px;
}

.filter-chip-2 {
  display: block;
  width: 80px;
  min-height: 32px;
  padding: 16px;
  background-color: #1d2737;
  border-radius: 20px;
}

.filter-chip-3 {
  display: block;
  width: 80px;
  min-height: 32px;
  padding: 16px;
  background-color: #1d2737;
  border-radius: 20px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 24px;
  row-gap: 16px;
  min-height: 60px;
  padding: 16px;
}

.product-card {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 16px;
  min-height: 60px;
  padding: 16px;
  overflow: hidden;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 12px;
  flex-grow: 1;
}

.product-image-box {
  display: block;
  width: 100%;
  min-height: 60px;
  aspect-ratio: 4/3;
  padding: 16px;
  background-color: #1d2737;
}

.product-info {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 12px;
  min-height: 60px;
  padding: 16px;
  flex-grow: 1;
}

.product-title {
  display: block;
  width: 75%;
  min-height: 20px;
  padding: 16px;
  background-color: #f0f6fc;
  border-radius: 4px;
}

.product-meta {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  min-height: 60px;
  padding: 16px;
  flex-grow: 1;
}

.product-price {

  padding: 16px;
  background-color: #10b981;
  border-radius: 4px;
}

@media (max-width: 576px) {
  .catalog-wrapper {

    padding: 20px 16px 20px 16px;
  }

  .catalog-toolbar {
    flex-direction: column;
    gap: 12px;
    padding: 12px 12px 12px 12px;
  }

  .toolbar-search {
    width: 100%;
  }

  .toolbar-filters {
    width: 100%;
    gap: 8px;
