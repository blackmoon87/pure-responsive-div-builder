<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Responsive DIV Structure</title>
  <style>
/* Reset & Global */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  min-height: 100vh;
  background-color: #0a0d12;
  color: #f0f6fc;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Desktop Base Styles */
.app-root {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 0px;
  min-height: 600px;
  padding: 0px;
  flex-grow: 1;
}

.app-header {
  display: block;
  width: 100%;
  min-height: 64px;
  padding: 16px 24px 16px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  background-color: #111620;
  border: 1px solid #263447;
}

.app-main-layout {
  display: grid;
  grid-template-columns: 240px 1fr 280px;
  gap: 20px;
  row-gap: 16px;
  margin-left: auto;
  margin-right: auto;
  justify-self: center;
  min-height: 60px;
  max-width: 1440px;
  padding: 24px;
}

.left-nav {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 12px;
  min-height: 60px;
  padding: 20px;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 12px;
  flex-grow: 1;
  order: 1;
}

.center-content {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 20px;
  min-height: 60px;
  padding: 24px;
  background-color: #18202d;
  border: 1px solid #263447;
  border-radius: 12px;
  flex-grow: 1;
  order: 2;
}

.content-hero-box {
  display: block;
  min-height: 200px;
  padding: 16px;
  background-color: #1d2737;
  border-radius: 8px;
}

.content-grid-cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  min-height: 60px;
  padding: 16px;
}

.inner-card {
  display: block;
  min-height: 140px;
  padding: 16px;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 8px;
}

.inner-card-2 {
  display: block;
  min-height: 140px;
  padding: 16px;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 8px;
}

.right-sidebar {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 16px;
  min-height: 60px;
  padding: 20px;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 12px;
  flex-grow: 1;
  order: 3;
}

.app-footer {
  display: block;
  width: 100%;
  min-height: 50px;
  padding: 16px 24px 16px 24px;
  margin: auto 0 0 0;
  background-color: #111620;
  border: 1px solid #263447;
}

/* Tablet (max-width: 992px) */
@media (max-width: 992px) {
  .app-main-layout {
    grid-template-columns: 200px 1fr;
    gap: 16px;
    padding: 20px 16px 20px 16px;
  }

  .left-nav {
    padding: 16px 16px 16px 16px;
  }

  .center-content {
    padding: 16px 16px 16px 16px;
  }

  .right-sidebar {
    padding: 16px 16px 16px 16px;
    grid-column: span 2;
  }
}

/* Mobile (max-width: 576px) */
@media (max-width: 576px) {
  .app-header {
    padding: 12px 16px 12px 16px;
  }

  .app-main-layout {
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 16px 16px 16px 16px;
  }

  .left-nav {
    padding: 16px 16px 16px 16px;
    order: 2;
  }

  .center-content {
    gap: 16px;
    padding: 16px 16px 16px 16px;
    order: 1;
  }

  .content-grid-cards {
    grid-template-columns: repeat(1, 1fr);
    gap: 12px;
  }

  .right-sidebar {
    padding: 16px 16px 16px 16px;
  }
}
  </style>
</head>
<body>
  <div class="app-root">
    <div class="app-header">
    </div>
    <div class="app-main-layout">
      <div class="left-nav">
      </div>
      <div class="center-content">
        <div class="content-hero-box">
        </div>
        <div class="content-grid-cards">
          <div class="inner-card">
          </div>
          <div class="inner-card-2">
          </div>
        </div>
      </div>
      <div class="right-sidebar">
      </div>
    </div>
    <div class="app-footer">
    </div>
  </div>
</body>
</html>
