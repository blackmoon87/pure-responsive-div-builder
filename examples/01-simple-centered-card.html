<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Responsive DIV Structure</title>
  <style>
/* Reset & Global */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  min-height: 100vh;
  background-color: #0a0d12;
  color: #f0f6fc;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Desktop Base Styles */
.card-container {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 20px;
  margin-left: auto;
  margin-right: auto;
  width: 100%;
  min-height: 280px;
  max-width: 460px;
  padding: 32px;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  flex-grow: 1;
}

.card-header {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  min-height: 40px;
  padding: 16px;
  flex-grow: 1;
}

.card-badge {
  display: block;
  width: 80px;
  min-height: 24px;
  padding: 16px;
  background-color: #38bdf826;
  border: 1px solid #38bdf8;
  border-radius: 20px;
  min-width: 0;
}

.card-body {
  display: block;
  min-height: 120px;
  padding: 16px;
  background-color: #18202d;
  border-radius: 8px;
}

.card-footer {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: flex-end;
  align-items: stretch;
  gap: 12px;
  min-height: 44px;
  padding: 16px;
  flex-grow: 1;
}

.btn-action {
  display: block;
  width: 120px;
  min-height: 40px;
  padding: 16px;
  background-color: #38bdf8;
  border-radius: 8px;
  min-width: 0;
}

/* Mobile (max-width: 576px) */
@media (max-width: 576px) {
  .card-container {
    padding: 20px 20px 20px 20px;
  }

  .card-footer {
    flex-direction: column;
  }

  .btn-action {
    width: 100%;
    min-width: auto;
  }
}
  </style>
</head>
<body>
  <div class="card-container">
    <div class="card-header">
      <div class="card-badge">
      </div>
    </div>
    <div class="card-body">
    </div>
    <div class="card-footer">
      <div class="btn-action">
      </div>
    </div>
  </div>
</body>
</html>
