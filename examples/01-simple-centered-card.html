<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example 01: Simple Centered Card | Pure Responsive DIV Builder</title>
  <style>
    /* Reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 100%; min-height: 100vh; background: #0a0d12; color: #f0f6fc; font-family: system-ui, -apple-system, sans-serif; }

    /* Desktop Base Styles */
    .page-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 460px;
      padding: 32px;
      background-color: #111620;
      border: 1px solid #263447;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      gap: 20px;
      margin-left: auto;
      margin-right: auto;
    }

    .card-header {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      min-height: 40px;
    }

    .card-badge {
      display: block;
      width: 80px;
      min-height: 24px;
      background-color: #38bdf826;
      border: 1px solid #38bdf8;
      border-radius: 20px;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 120px;
      background-color: #18202d;
      border-radius: 8px;
      padding: 16px;
    }

    .card-footer {
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      gap: 12px;
      min-height: 44px;
    }

    .btn-action {
      display: block;
      width: 120px;
      min-height: 40px;
      background-color: #38bdf8;
      border-radius: 8px;
    }

    /* Mobile Breakpoint (<= 576px) */
    @media (max-width: 576px) {
      .card-container {
        padding: 20px;
      }
      .card-footer {
        flex-direction: column;
      }
      .btn-action {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="page-wrapper">
  <div class="card-container">
    <div class="card-header">
      <div class="card-badge"></div>
    </div>
    <div class="card-body"></div>
    <div class="card-footer">
      <div class="btn-action"></div>
    </div>
  </div>
</div>

</body>
</html>
