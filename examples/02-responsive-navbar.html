<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example 02: Responsive Sticky Navbar | Pure Responsive DIV Builder</title>
  <style>
    /* Reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 100%; min-height: 100vh; background: #0a0d12; color: #f0f6fc; font-family: system-ui, sans-serif; }

    /* Desktop Base Styles */
    .site-header {
      display: block;
      position: sticky;
      top: 0;
      width: 100%;
      background-color: #111620;
      border-bottom: 1px solid #263447;
      z-index: 100;
    }

    .nav-container {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
      padding: 16px 24px;
      min-height: 68px;
    }

    .brand-logo {
      display: block;
      width: 140px;
      min-height: 36px;
      background-color: #38bdf8;
      border-radius: 6px;
    }

    .nav-links {
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: center;
    }

    .nav-item {
      display: block;
      width: 70px;
      min-height: 24px;
      background-color: #1d2737;
      border-radius: 4px;
    }

    .nav-actions {
      display: flex;
      flex-direction: row;
      gap: 12px;
    }

    .btn-cta {
      display: block;
      width: 100px;
      min-height: 36px;
      background-color: #6366f1;
      border-radius: 6px;
    }

    .main-body {
      display: flex;
      flex-direction: column;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
      padding: 40px 24px;
      gap: 24px;
    }

    .hero-banner {
      display: block;
      min-height: 300px;
      background-color: #18202d;
      border: 1px solid #263447;
      border-radius: 12px;
    }

    /* Mobile Breakpoint (<= 576px) */
    @media (max-width: 576px) {
      .nav-container {
        flex-direction: column;
        gap: 16px;
        padding: 16px;
      }
      .nav-links {
        width: 100%;
        justify-content: space-between;
      }
      .nav-actions {
        width: 100%;
      }
      .btn-cta {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="site-header">
  <div class="nav-container">
    <div class="brand-logo"></div>
    <div class="nav-links">
      <div class="nav-item"></div>
      <div class="nav-item"></div>
      <div class="nav-item"></div>
      <div class="nav-item"></div>
    </div>
    <div class="nav-actions">
      <div class="btn-cta"></div>
    </div>
  </div>
</div>

<div class="main-body">
  <div class="hero-banner"></div>
</div>

</body>
</html>
