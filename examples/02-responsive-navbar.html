<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Responsive DIV Structure</title>
  <style>
/* Reset & Global */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  min-height: 100vh;
  background-color: #0a0d12;
  color: #f0f6fc;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Desktop Base Styles */
.site-header {
  display: block;
  width: 100%;
  min-height: 60px;
  padding: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  background-color: #111620;
  border: 1px solid #263447;
}

.nav-container {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-left: auto;
  margin-right: auto;
  min-height: 68px;
  max-width: 1200px;
  padding: 16px 24px 16px 24px;
  flex-grow: 1;
}

.brand-logo {
  display: block;
  width: 140px;
  min-height: 36px;
  padding: 16px;
  background-color: #38bdf8;
  border-radius: 6px;
  min-width: 0;
}

.nav-links {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: center;
  gap: 20px;
  min-height: 60px;
  padding: 16px;
  min-width: 0;
  flex-grow: 1;
}

.nav-item {
  display: block;
  width: 70px;
  min-height: 24px;
  padding: 16px;
  background-color: #1d2737;
  border-radius: 4px;
  min-width: 0;
}

.nav-item-2 {
  display: block;
  width: 70px;
  min-height: 24px;
  padding: 16px;
  background-color: #1d2737;
  border-radius: 4px;
  min-width: 0;
}

.nav-item-3 {
  display: block;
  width: 70px;
  min-height: 24px;
  padding: 16px;
  background-color: #1d2737;
  border-radius: 4px;
  min-width: 0;
}

.nav-item-4 {
  display: block;
  width: 70px;
  min-height: 24px;
  padding: 16px;
  background-color: #1d2737;
  border-radius: 4px;
  min-width: 0;
}

.nav-actions {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 12px;
  min-height: 60px;
  padding: 16px;
  min-width: 0;
  flex-grow: 1;
}

.btn-cta {
  display: block;
  width: 100px;
  min-height: 36px;
  padding: 16px;
  background-color: #6366f1;
  border-radius: 6px;
  min-width: 0;
}

.hero-banner {
  display: block;
  margin-left: auto;
  margin-right: auto;
  min-height: 300px;
  max-width: 1200px;
  padding: 16px;
  margin: 40px auto 40px auto;
  background-color: #18202d;
  border: 1px solid #263447;
  border-radius: 12px;
}

/* Mobile (max-width: 576px) */
@media (max-width: 576px) {
  .nav-container {
    flex-direction: column;
    padding: 16px 16px 16px 16px;
  }

  .brand-logo {
    min-width: auto;
  }

  .nav-links {
    width: 100%;
    gap: 8px;
    min-width: auto;
  }

  .nav-item {
    width: 60px;
  }

  .nav-item-2 {
    width: 60px;
  }

  .nav-item-3 {
    width: 60px;
  }

  .nav-item-4 {
    width: 60px;
  }

  .nav-actions {
    width: 100%;
    min-width: auto;
  }

  .btn-cta {
    width: 100%;
  }

  .hero-banner {
    padding: 16px 16px 16px 16px;
  }
}
  </style>
</head>
<body>

  <div class="site-header">
    <div class="nav-container">
      <div class="brand-logo">
      </div>
      <div class="nav-links">
        <div class="nav-item">
        </div>
        <div class="nav-item-2">
        </div>
        <div class="nav-item-3">
        </div>
        <div class="nav-item-4">
        </div>
      </div>
      <div class="nav-actions">
        <div class="btn-cta">
        </div>
      </div>
    </div>
  </div>
  <div class="hero-banner">
  </div>

</body>
</html>
