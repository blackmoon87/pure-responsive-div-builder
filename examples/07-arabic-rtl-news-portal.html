<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Responsive DIV Structure</title>
  <style>
/* Reset & Global */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  min-height: 100vh;
  background-color: #0a0d12;
  color: #f0f6fc;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

/* Desktop Base Styles */
.portal-root {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 0px;
  min-height: 600px;
  padding: 0px;
  flex-grow: 1;
  direction: rtl;
}

.top-ticker-bar {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: center;
  gap: 16px;
  min-height: 38px;
  padding: 8px 24px 8px 24px;
  background-color: #f43f5e;
  flex-grow: 1;
}

.ticker-badge {
  display: block;
  width: 80px;
  min-height: 24px;
  padding: 16px;
  background-color: #ffffff;
  border-radius: 4px;
  min-width: 0;
}

.ticker-text {
  display: block;
  min-height: 18px;
  padding: 16px;
  background-color: rgba(255, 255, 255, 0.4);
  border-radius: 4px;
  min-width: 0;
}

.portal-nav {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  width: 100%;
  min-height: 70px;
  padding: 16px 32px 16px 32px;
  background-color: #111620;
  border: 1px solid #263447;
  flex-grow: 1;
}

.portal-logo {
  display: block;
  width: 160px;
  min-height: 40px;
  padding: 16px;
  background-color: #38bdf8;
  border-radius: 8px;
  min-width: 0;
}

.portal-menu {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 20px;
  min-height: 60px;
  padding: 16px;
  min-width: 0;
  flex-grow: 1;
}

.menu-link {
  display: block;
  width: 80px;
  min-height: 24px;
  padding: 16px;
  background-color: #18202d;
  border-radius: 4px;
  min-width: 0;
}

.menu-link-2 {
  display: block;
  width: 80px;
  min-height: 24px;
  padding: 16px;
  background-color: #18202d;
  border-radius: 4px;
  min-width: 0;
}

.menu-link-3 {
  display: block;
  width: 80px;
  min-height: 24px;
  padding: 16px;
  background-color: #18202d;
  border-radius: 4px;
  min-width: 0;
}

.menu-link-4 {
  display: block;
  width: 80px;
  min-height: 24px;
  padding: 16px;
  background-color: #18202d;
  border-radius: 4px;
  min-width: 0;
}

.portal-body {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 32px;
  margin-left: auto;
  margin-right: auto;
  width: 100%;
  min-height: 60px;
  max-width: 1360px;
  padding: 32px 24px 32px 24px;
  flex-grow: 1;
}

.featured-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 24px;
  row-gap: 16px;
  width: 100%;
  min-height: 60px;
  padding: 16px;
}

.main-lead-story {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-end;
  align-items: stretch;
  gap: 12px;
  width: 100%;
  min-height: 420px;
  padding: 24px;
  background-color: #18202d;
  border: 1px solid #263447;
  border-radius: 14px;
  flex-grow: 1;
}

.lead-tag {
  display: block;
  width: 90px;
  min-height: 24px;
  padding: 16px;
  background-color: #f43f5e;
  border-radius: 4px;
}

.lead-headline {
  display: block;
  width: 80%;
  min-height: 32px;
  padding: 16px;
  background-color: #f0f6fc;
  border-radius: 6px;
}

.lead-summary {
  display: block;
  width: 60%;
  min-height: 20px;
  padding: 16px;
  background-color: #5a6b85;
  border-radius: 4px;
}

.secondary-column {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 16px;
  width: 100%;
  min-height: 60px;
  padding: 16px;
  flex-grow: 1;
}

.news-card-small {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 8px;
  width: 100%;
  min-height: 125px;
  padding: 16px;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 10px;
  flex-grow: 1;
}

.news-card-small-2 {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 8px;
  width: 100%;
  min-height: 125px;
  padding: 16px;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 10px;
  flex-grow: 1;
}

.news-card-small-3 {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 8px;
  width: 100%;
  min-height: 125px;
  padding: 16px;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 10px;
  flex-grow: 1;
}

.articles-3col-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  row-gap: 16px;
  width: 100%;
  min-height: 60px;
  padding: 16px;
}

.article-box {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 16px;
  width: 100%;
  min-height: 60px;
  padding: 16px;
  overflow: hidden;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 12px;
  flex-grow: 1;
}

.article-img {
  display: block;
  width: 100%;
  min-height: 60px;
  aspect-ratio: 16/9;
  padding: 16px;
  background-color: #1d2737;
}

.article-content {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 12px;
  min-height: 80px;
  padding: 20px;
  flex-grow: 1;
}

.article-box-2 {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 16px;
  width: 100%;
  min-height: 60px;
  padding: 16px;
  overflow: hidden;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 12px;
  flex-grow: 1;
}

.article-img-2 {
  display: block;
  width: 100%;
  min-height: 60px;
  aspect-ratio: 16/9;
  padding: 16px;
  background-color: #1d2737;
}

.article-content-2 {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 12px;
  min-height: 80px;
  padding: 20px;
  flex-grow: 1;
}

.article-box-3 {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 16px;
  width: 100%;
  min-height: 60px;
  padding: 16px;
  overflow: hidden;
  background-color: #111620;
  border: 1px solid #263447;
  border-radius: 12px;
  flex-grow: 1;
}

.article-img-3 {
  display: block;
  width: 100%;
  min-height: 60px;
  aspect-ratio: 16/9;
  padding: 16px;
  background-color: #1d2737;
}

.article-content-3 {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 12px;
  min-height: 80px;
  padding: 20px;
  flex-grow: 1;
}

.portal-footer {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  row-gap: 16px;
  width: 100%;
  min-height: 60px;
  padding: 40px 32px 40px 32px;
  margin: auto 0 0 0;
  background-color: #111620;
  border: 1px solid #263447;
}

.footer-col {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 12px;
  width: 100%;
  min-height: 100px;
  padding: 16px;
  flex-grow: 1;
}

.footer-col-2 {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 12px;
  width: 100%;
  min-height: 100px;
  padding: 16px;
  flex-grow: 1;
}

.footer-col-3 {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 12px;
  width: 100%;
  min-height: 100px;
  padding: 16px;
  flex-grow: 1;
}

.footer-col-4 {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: flex-start;
  align-items: stretch;
  gap: 12px;
  width: 100%;
  min-height: 100px;
  padding: 16px;
  flex-grow: 1;
}

/* Tablet (max-width: 992px) */
@media (max-width: 992px) {
  .featured-grid {
    grid-template-columns: 1fr;
  }

  .articles-3col-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .portal-footer {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Mobile (max-width: 576px) */
@media (max-width: 576px) {
  .top-ticker-bar {
    gap: 10px;
    padding: 8px 16px 8px 16px;
  }

  .ticker-badge {
    width: 60px;
    flex-shrink: 0;
  }

  .portal-nav {
    flex-direction: column;
    padding: 16px 16px 16px 16px;
  }

  .portal-logo {
    width: 140px;
    min-width: auto;
  }

  .portal-menu {
    width: 100%;
    gap: 8px;
    min-width: auto;
  }

  .menu-link {
    width: 65px;
  }

  .menu-link-2 {
    width: 65px;
  }

  .menu-link-3 {
    width: 65px;
  }

  .menu-link-4 {
    width: 65px;
  }

  .portal-body {
    gap: 20px;
    padding: 20px 16px 20px 16px;
  }

  .featured-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .main-lead-story {
    padding: 16px 16px 16px 16px;
    min-height: 260px;
  }

  .lead-headline {
    width: 100%;
  }

  .lead-summary {
    width: 100%;
  }

  .articles-3col-grid {
    grid-template-columns: repeat(1, 1fr);
    gap: 16px;
  }

  .portal-footer {
    grid-template-columns: repeat(1, 1fr);
    gap: 16px;
    padding: 24px 16px 24px 16px;
  }
}
  </style>
</head>
<body>

  <div class="portal-root" dir="rtl">
    <div class="top-ticker-bar">
      <div class="ticker-badge">
      </div>
      <div class="ticker-text">
      </div>
    </div>
    <div class="portal-nav">
      <div class="portal-logo">
      </div>
      <div class="portal-menu">
        <div class="menu-link">
        </div>
        <div class="menu-link-2">
        </div>
        <div class="menu-link-3">
        </div>
        <div class="menu-link-4">
        </div>
      </div>
    </div>
    <div class="portal-body">
      <div class="featured-grid">
        <div class="main-lead-story">
          <div class="lead-tag">
          </div>
          <div class="lead-headline">
          </div>
          <div class="lead-summary">
          </div>
        </div>
        <div class="secondary-column">
          <div class="news-card-small">
          </div>
          <div class="news-card-small-2">
          </div>
          <div class="news-card-small-3">
          </div>
        </div>
      </div>
      <div class="articles-3col-grid">
        <div class="article-box">
          <div class="article-img">
          </div>
          <div class="article-content">
          </div>
        </div>
        <div class="article-box-2">
          <div class="article-img-2">
          </div>
          <div class="article-content-2">
          </div>
        </div>
        <div class="article-box-3">
          <div class="article-img-3">
          </div>
          <div class="article-content-3">
          </div>
        </div>
      </div>
    </div>
    <div class="portal-footer">
      <div class="footer-col">
      </div>
      <div class="footer-col-2">
      </div>
      <div class="footer-col-3">
      </div>
      <div class="footer-col-4">
      </div>
    </div>
  </div>

</body>
</html>
